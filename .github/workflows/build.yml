name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  LIBDATACHANNEL_REF: v0.24.6

jobs:
  # Every target is cross-compiled with Zig on Linux; tests then run natively per OS.
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x86_64, macos-aarch64, windows-x86_64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Fetch libdatachannel
        run: |
          git clone --depth 1 --branch "$LIBDATACHANNEL_REF" \
            https://github.com/paullouisageneau/libdatachannel.git src
          git -C src submodule update --init --depth 1 deps/libjuice deps/usrsctp deps/plog

      - name: Build
        run: mkdir -p build && ./build.sh "${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: libdatachannel-${{ matrix.target }}
          path: dist/*.tar.gz

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-22.04
          - target: macos-aarch64
            os: macos-14
          - target: windows-x86_64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: actions/download-artifact@v4
        with:
          name: libdatachannel-${{ matrix.target }}
          path: dist

      - name: Verified wss:// connections
        run: |
          mkdir -p build
          tar -xzf "dist/libdatachannel-${{ matrix.target }}.tar.gz" -C dist
          ./test.sh "${{ matrix.target }}"

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "libdatachannel $LIBDATACHANNEL_REF static archives (OpenSSL 3.5.9) built with Zig 0.16.0."
        env:
          GH_TOKEN: ${{ github.token }}
