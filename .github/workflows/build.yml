name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  LIBDATACHANNEL_REF: v0.24.6

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-22.04
          - target: macos-aarch64
            os: macos-14
          - target: windows-x86_64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Fetch libdatachannel
        run: |
          git clone --depth 1 --branch "$LIBDATACHANNEL_REF" \
            https://github.com/paullouisageneau/libdatachannel.git src
          git -C src submodule update --init --depth 1 deps/libjuice deps/usrsctp deps/plog

      - name: Install OpenSSL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Install OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install openssl:x64-windows-static
          echo "OPENSSL_ROOT_DIR=$VCPKG_INSTALLATION_ROOT/installed/x64-windows-static" >> "$GITHUB_ENV"

      - name: Build
        run: ./build.sh "${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: libdatachannel-${{ matrix.target }}
          path: dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "libdatachannel $LIBDATACHANNEL_REF prebuilt shared libraries."
        env:
          GH_TOKEN: ${{ github.token }}
